<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLP App | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: #f7f7ff;
            color: #111827;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(132, 74, 255, 0.23),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(100, 80, 255, 0.12),
                    transparent 25%
                ),
                #f7f7ff;
        }

        /* Decorative shapes */

        .shape-one {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: #7c3aed;
            opacity: 0.12;
            filter: blur(70px);
            top: -150px;
            right: -100px;
        }

        .shape-two {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #4f46e5;
            opacity: 0.1;
            filter: blur(80px);
            bottom: -150px;
            left: -100px;
        }

        /* Main */

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 2;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 21px;
            background: linear-gradient(
                135deg,
                #8b3dff,
                #2675ff
            );
            box-shadow:
                0 10px 25px rgba(112,65,255,0.25);
        }

        .logo span {
            font-size: 24px;
            font-weight: 800;
        }

        .card {
            padding: 38px;
            border-radius: 20px;
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            box-shadow:
                0 25px 70px rgba(61,54,100,0.13);
        }

        .heading-small {
            color: #7c3aed;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: -1.5px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: #7b8295;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 51px;
            padding: 0 15px;
            border: 1px solid #d8dbe7;
            border-radius: 10px;
            background: rgba(255,255,255,0.8);
            outline: none;
            font-family: inherit;
            font-size: 13px;
            transition: 0.2s;
        }

        input::placeholder {
            color: #a1a7b7;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow:
                0 0 0 4px rgba(124,58,237,0.08);
        }

        .terms {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            color: #7a8192;
            font-size: 10px;
            line-height: 1.5;
            margin: 20px 0;
        }

        .terms input {
            width: 15px;
            height: 15px;
            margin-top: 1px;
            accent-color: #7c3aed;
        }

        .terms a {
            color: #7c3aed;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                100deg,
                #8b2cff,
                #386eff
            );
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 10px 25px rgba(107,55,240,0.23);
            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 30px rgba(107,55,240,0.32);
        }

        .login {
            text-align: center;
            margin-top: 24px;
            color: #777e91;
            font-size: 12px;
        }

        .login a {
            color: #7c3aed;
            font-weight: 700;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 550px) {

            body {
                overflow: auto;
            }

            .page {
                padding: 20px;
                align-items: flex-start;
            }

            .container {
                margin-top: 20px;
            }

            .card {
                padding: 27px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="shape-one"></div>
    <div class="shape-two"></div>

    <div class="container">

        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>NLP App</span>
        </div>

        <div class="card">

            <div class="heading-small">
                Create Account
            </div>

            <h1>
                Join NLP App 👋
            </h1>

            <p class="subtitle">
                Start building with the power of language.
            </p>


            <form>

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Create a strong password"
                        required
                    >

                </div>


                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>
                    </label>

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account&nbsp;&nbsp; →
                </button>

            </form>


            <p class="login">
                Already a member?
                <a href="/login">
                    Login here
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
